name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Drop superseded pull request runs, but let every commit pushed to a branch finish. A
  # cancelled run reads as a failure in the status badge, and pushing a commit and then a
  # release commit moments later used to cancel the first one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      # The integration suite needs the real CLI. A pinned module version keeps render output
      # stable, and the Go checksum database verifies the fetch. See packages/d2/src/runner.ts for the
      # version floor.
      - name: Install pinned D2 CLI
        run: go install github.com/d2lang/d2@v0.8.1
      - run: d2 --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
